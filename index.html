<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Country Explorer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <svg class="header__icon" viewBox="0 0 64 64" width="44" height="44" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="32" cy="26" r="20" />
      <path d="M12 26h40M32 6c-8 8-8 32 0 40M32 6c8 8 8 32 0 40" />
      <path d="M20 58h24M32 46v12" />
    </svg>
    <h1 class="header__title">Country Explorer</h1>
  </header>

  <main class="main">
    <section class="filters">
      <div class="filter">
        <label for="nameInput">Search by Country Name:</label>
        <input type="text" id="nameInput" placeholder="Enter Country Name" autocomplete="off" />
      </div>

      <div class="filter">
        <label for="regionSelect">Select a Region:</label>
        <select id="regionSelect">
          <option value="">All Regions</option>
          <option value="Africa">Africa</option>
          <option value="Americas">Americas</option>
          <option value="Asia">Asia</option>
          <option value="Europe">Europe</option>
          <option value="Oceania">Oceania</option>
          <option value="Antarctic">Antarctic</option>
        </select>
      </div>

      <div class="filter">
        <label for="populationInput">Search by Population:</label>
        <input type="number" id="populationInput" placeholder="0" min="0" max="1500000000" />
        <small>Max - 1.5 Billion (1500000000)</small>
      </div>
    </section>

    <p id="status" class="status" role="status"></p>

    <section id="grid" class="grid" aria-live="polite"></section>

    <button id="showMore" class="show-more" type="button">Show More</button>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal__close" type="button" aria-label="Close" data-close>&times;</button>
      <div class="modal__img"><img id="modalFlag" alt="" /></div>
      <h2 id="modalTitle" class="modal__title"></h2>
      <p id="modalOfficial" class="modal__official"></p>
      <dl id="modalDetails" class="modal__details"></dl>
    </div>
  </div>

  <script src="api-script.js"></script>
</body>
</html>
