<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Country Explorer</title>
  <link rel="stylesheet" href="design.css" />
</head>
<body>

  <!-- Reusable image placeholder icon -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="img-icon" viewBox="0 0 100 80">
      <rect x="2" y="2" width="96" height="76" rx="4" fill="#e6e6e6" stroke="#bdbdbd" stroke-width="3" />
      <circle cx="72" cy="22" r="7" fill="#9e9e9e" stroke="#bdbdbd" stroke-width="2" />
      <path d="M8 70 L36 32 L52 52 L62 42 L92 70 Z" fill="#a8a8a8" stroke="#bdbdbd" stroke-width="2" stroke-linejoin="round" />
      <path d="M28 70 L36 56 L44 70" fill="none" stroke="#e6e6e6" stroke-width="2" />
    </symbol>
  </svg>

  <header class="header">
    <svg class="header__icon" viewBox="0 0 64 64" width="46" height="46" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="32" cy="26" r="20" />
      <path d="M12 26h40M32 6c-8 8-8 32 0 40M32 6c8 8 8 32 0 40" />
      <path d="M20 58h24M32 46v12" />
    </svg>
    <h1 class="header__title">Country Explorer</h1>
  </header>

  <main class="main">

    <section class="filters">
      <div class="filter">
        <label for="name">Search by Country Name:</label>
        <input type="text" id="name" class="filter__name" placeholder="Enter Country Name" />
      </div>

      <div class="filter">
        <label for="region">Select a Region:</label>
        <select id="region" class="filter__region">
          <option value="">All Regions</option>
          <option>Africa</option>
          <option>Americas</option>
          <option>Asia</option>
          <option>Europe</option>
          <option>Oceania</option>
        </select>
      </div>

      <div class="filter">
        <label for="population">Search by Population:</label>
        <input type="number" id="population" class="filter__population" placeholder="0" min="0" max="1500000000" />
        <small>Max - 1.5 Billion (1500000000)</small>
      </div>
    </section>

    <div id="country-cards-container" class="grid"></div>

    <button id="showMore" class="show-more" type="button">Show More</button>

  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
